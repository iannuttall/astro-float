packages:
  - packages/*
  - demo

# pnpm 10 blocks postinstall scripts by default; these two need theirs.
onlyBuiltDependencies:
  - esbuild
  - sharp

# Patched versions of transitive deps whose parents' ranges already allow them.
overrides:
  esbuild@<0.28.1: ^0.28.1
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  source-map-js@<1.2.2: ^1.2.2
